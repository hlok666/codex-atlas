name: Release Codex Atlas

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Build Windows desktop package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri:build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: codex-atlas-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Build Android companion package
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew
      - name: Prepare Android signing key
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/codex-atlas-release.jks
      - name: Build Android companion package
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/codex-atlas-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            android/gradlew --no-daemon -p android assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/codex-atlas-android.apk
          else
            echo "::warning::Android signing secrets are not configured; producing a debug APK that cannot receive seamless updates."
            android/gradlew --no-daemon -p android assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/codex-atlas-android.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: codex-atlas-android
          path: android/app/build/outputs/apk/**/codex-atlas-android.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: release-assets/**/*
